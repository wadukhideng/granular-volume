name: Build F-Droid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build F-Droid RELEASE APK
        working-directory: android
        run: ./gradlew assembleFdroidRelease --stacktrace --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granular-volume-fdroid-release
          path: android/app/build/outputs/apk/fdroid/release/*.apk
          retention-days: 30
          if-no-files-found: warn
