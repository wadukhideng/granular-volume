name: Build F-Droid APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute
        working-directory: android
        run: chmod +x ./gradlew
      - name: Build Release
        working-directory: android
        run: ./gradlew assembleFdroidRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granular-volume-fdroid-release
          path: android/app/build/outputs/apk/fdroid/release/*.apk
